name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests --cov=biz.agent --cov-report=term-missing
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Build runtime image
        run: docker build -t review-ci:${{ github.sha }} .
      - name: Offline isolated worker and Agent-only API smoke
        run: |
          docker run --rm --network none --user 1000:1000 \
            --tmpfs /app/log:uid=1000,gid=1000 --tmpfs /app/data:uid=1000,gid=1000 \
            -i review-ci:${{ github.sha }} python - < scripts/smoke_worker.py
